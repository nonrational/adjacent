<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A local dev-server harness for humans and agents to share.">
  <title>Adjacent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0a0a0a;
      --paper: #ededea;
      --dim: #6b6b66;
      --rule: #1f1f1d;
      --accent: #d4a574;
      --accent-dim: #8a6a44;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'JetBrains Mono', 'Berkeley Mono', 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    body {
      min-height: 100vh;
      padding: 4rem 2rem;
      background-image:
        radial-gradient(circle at 20% 0%, rgba(212, 165, 116, 0.04), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(212, 165, 116, 0.03), transparent 50%);
    }
    .frame { max-width: 720px; margin: 0 auto; animation: rise 0.6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    header { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--dim); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6rem; }
    header a { color: var(--dim); text-decoration: none; border-bottom: 1px dotted var(--dim); }
    header a:hover { color: var(--accent); border-color: var(--accent); }

    .wordmark { font-weight: 700; font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1; letter-spacing: -0.04em; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0; margin-bottom: 1.75rem; }
    .wordmark .a { color: var(--paper); }
    .wordmark .b { color: var(--accent); }
    .wordmark .slash { color: var(--rule); font-weight: 300; margin: 0 0.1em; }
    .wordmark small { font-size: 0.22em; font-weight: 400; color: var(--dim); letter-spacing: 0.2em; text-transform: uppercase; align-self: center; margin-left: 1.5rem; padding-left: 1.5rem; border-left: 1px solid var(--rule); }

    .pitch { font-size: clamp(1.15rem, 2vw, 1.4rem); font-weight: 300; color: var(--paper); max-width: 38ch; line-height: 1.45; margin-bottom: 5rem; }
    .pitch em { color: var(--accent); font-style: normal; }

    section { margin-bottom: 4rem; }
    .label { font-size: 11px; color: var(--dim); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem; }
    .label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

    .framing p { margin-bottom: 1rem; max-width: 56ch; color: var(--paper); }
    .framing p:last-child { color: var(--dim); }
    .framing p:last-child strong { color: var(--paper); font-weight: 500; }

    .diagram { font-size: 12px; line-height: 1.4; color: var(--dim); white-space: pre; overflow-x: auto; padding: 1.5rem 0; }
    .diagram b { color: var(--accent); font-weight: 400; }

    .cmd { display: block; background: transparent; border-left: 2px solid var(--accent-dim); padding: 0.6rem 1rem; margin-bottom: 0.5rem; color: var(--paper); font-size: 14px; }
    .cmd .prompt { color: var(--accent); user-select: none; margin-right: 0.6rem; }
    .cmd .note { color: var(--dim); font-size: 12px; margin-left: 0.6rem; }

    footer { margin-top: 6rem; padding-top: 2rem; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); letter-spacing: 0.05em; }
    footer a { color: var(--paper); text-decoration: none; border-bottom: 1px solid var(--accent-dim); padding-bottom: 1px; }
    footer a:hover { color: var(--accent); border-color: var(--accent); }

    @media (max-width: 540px) {
      body { padding: 2rem 1.25rem; }
      header { margin-bottom: 3.5rem; }
      .wordmark small { display: none; }
      .pitch { margin-bottom: 3.5rem; }
      section { margin-bottom: 3rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <span>adj.ac<span style="color:var(--accent-dim)">/ent</span></span>
      <a href="https://github.com/nonrational/adjacent">github &rarr;</a>
    </header>

    <h1 class="wordmark"><span class="a">adj.ac</span><span class="slash">/</span><span class="b">ent</span></h1>
    <p class="pitch"><em>Humans</em> and <em>agents</em> live adjacently.</p>

    <section>
      <div class="label">status</div>
      <p style="color: var(--dim); max-width: 56ch;">Coming soon. Built in Rust. <strong style="color: var(--paper); font-weight: 500;">Never runs as root.</strong></p>
    </section>

    <footer>
      <span>adj.ac/ent &middot; 2026</span>
      <a href="https://github.com/nonrational/adjacent">source on github</a>
    </footer>
  </div>
</body>
</html>
